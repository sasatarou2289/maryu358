<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>maryu358 AI Anime Video Maker</title>
    <link rel="stylesheet" href="ai_video_maker.css">
  </head>
  <body>
    <main class="maker-shell">
      <section class="control-panel">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <p class="eyebrow">maryu358</p>
            <h1>AI Anime Video Maker</h1>
          </div>
        </div>

        <form id="videoForm" class="maker-form">
          <label>
            <span>動画テーマ</span>
            <textarea id="themeInput" rows="3" placeholder="例: トイレの花子さんが放課後の学校に現れる怪談アニメ">トイレの花子さんが放課後の学校に現れる怪談アニメ</textarea>
          </label>

          <div class="form-grid">
            <label>
              <span>ジャンル・題材</span>
              <input id="serviceInput" list="genreOptions" type="text" value="怪談・学校ホラー">
              <datalist id="genreOptions">
                <option value="怪談・学校ホラー"></option>
                <option value="日常系アニメ"></option>
                <option value="ファンタジー冒険"></option>
                <option value="恋愛ショート"></option>
                <option value="ミステリー"></option>
                <option value="コメディ"></option>
              </datalist>
            </label>

            <label>
              <span>動画尺</span>
              <select id="durationInput">
                <option value="15">15秒</option>
                <option value="30">30秒</option>
                <option value="60">1分</option>
                <option value="120">2分</option>
                <option value="180">3分</option>
                <option value="300">5分</option>
                <option value="600">10分</option>
                <option value="900">15分</option>
                <option value="1800">30分</option>
              </select>
            </label>

            <label>
              <span>画面比率</span>
              <select id="orientationInput">
                <option value="portrait">縦 9:16</option>
                <option value="landscape">横 16:9</option>
              </select>
            </label>

            <label>
              <span>あらすじ・起きること</span>
              <input id="painInput" type="text" value="放課後、誰もいない校舎のトイレから女の子の声が聞こえる">
            </label>

            <label>
              <span>ラスト・オチ</span>
              <input id="ctaInput" type="text" value="振り向くと、鏡の中だけに花子さんが立っている">
            </label>
          </div>

          <label>
            <span>アニメの雰囲気</span>
            <input id="styleInput" type="text" value="昭和の学校、薄暗い廊下、少し怖いけど見やすい、2Dアニメ">
          </label>

          <div class="action-row">
            <button class="primary-button" type="submit">構成を生成</button>
            <button class="secondary-button" id="previewButton" type="button">プレビュー再生</button>
            <button class="ghost-button" id="recordButton" type="button">動画を書き出す</button>
          </div>
        </form>

        <section class="prompt-box" aria-label="生成プロンプト">
          <div class="section-heading">
            <p class="eyebrow">Prompts</p>
            <h2>外部AI用プロンプト</h2>
          </div>
          <textarea id="promptOutput" rows="10" readonly></textarea>
          <button class="ghost-button" id="copyPromptButton" type="button">プロンプトをコピー</button>
        </section>
      </section>

      <section class="preview-panel">
        <div class="preview-header">
          <div>
            <p class="eyebrow">Preview</p>
            <h2>縦型アニメ動画</h2>
          </div>
          <a class="back-link" href="index.html">SNS Studioへ</a>
        </div>

        <div class="stage-wrap">
          <canvas id="videoCanvas" width="720" height="1280" aria-label="動画プレビュー"></canvas>
        </div>

        <div class="status-bar">
          <span id="statusText">構成を生成すると、ここで動画を確認できます。</span>
          <a id="downloadLink" class="download-link" hidden>WebMを保存</a>
        </div>

        <section class="storyboard-panel">
          <div class="section-heading">
            <p class="eyebrow">Storyboard</p>
            <h2>シーン構成</h2>
          </div>
          <div id="storyboardList" class="storyboard-list"></div>
        </section>
      </section>
    </main>

    <script src="ai_video_maker.js"></script>
  </body>
</html>
